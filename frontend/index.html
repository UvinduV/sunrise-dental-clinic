<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunrise Dental Clinic</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-md fixed-top" id="mainNav">
    <div class="container">
        <a class="navbar-brand" href="#" data-section="home-section"><i class="fa-solid fa-tooth"></i> Sunrise Dental</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navLinks">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navLinks">
            <ul class="navbar-nav ms-auto" id="navAuthed">
                <li class="nav-item"><a class="nav-link" href="#" data-section="appointments-section">Appointments</a></li>
                <li class="nav-item"><a class="nav-link" href="#" data-section="bills-section">Bills</a></li>
                <li class="nav-item"><a class="nav-link" href="#" data-section="patients-section">Patients</a></li>
                <li class="nav-item"><a class="nav-link" href="#" data-section="reports-section">Reports</a></li>
                <li class="nav-item"><a class="nav-link" href="#" data-section="help-section">Help</a></li>
                <li class="nav-item"><a class="nav-link" href="#" id="logoutLink">Logout</a></li>
            </ul>
            <ul class="navbar-nav ms-auto" id="navGuest">
                <li class="nav-item"><a class="nav-link" href="#" data-section="login-section">Login</a></li>
                <li class="nav-item"><a class="nav-link" href="#" data-section="help-section">Help</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container" id="app">

    <section id="home-section" class="app-section">
        <div class="hero">
            <h1>Sunrise Dental Clinic</h1>
            <p>Online Appointment &amp; Patient Management System</p>
            <button type="button" class="btn btn-primary btn-lg" data-section="login-section">Staff Login</button>
        </div>
    </section>

    <section id="login-section" class="app-section" hidden>
    </section>

    <section id="appointments-section" class="app-section" hidden>
    </section>

    <section id="bills-section" class="app-section" hidden>
    </section>

    <section id="patients-section" class="app-section" hidden>
    </section>

    <section id="reports-section" class="app-section" hidden>
    </section>

    <section id="help-section" class="app-section" hidden>
    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/apiClient.js"></script>
<script src="js/app.js"></script>
</body>
</html>
